services:
  # Web Service - PHP Application
  - type: web
    name: inventory-system
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: SESSION_SECURE
        value: true
      - key: SESSION_HTTPONLY
        value: true
      - key: SESSION_SAMESITE
        value: Strict
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: inventory-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: inventory-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: inventory-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: inventory-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: inventory-db
          property: password
    healthCheckPath: /ping.php

databases:
  # PostgreSQL Database (Free tier)
  - name: inventory-db
    plan: free
    databaseName: inventory_production
