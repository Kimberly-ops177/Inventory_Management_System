name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =====================================================
  # Continuous Integration
  # =====================================================
  test:
    name: Test & Quality Checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventory_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, json
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Create .env file
        run: |
          cp .env.example .env
          echo "DB_HOST=127.0.0.1" >> .env
          echo "DB_PORT=3306" >> .env
          echo "DB_DATABASE=inventory_test" >> .env
          echo "DB_USERNAME=root" >> .env
          echo "DB_PASSWORD=root" >> .env

      - name: Wait for MySQL
        run: |
          while ! mysqladmin ping -h127.0.0.1 -uroot -proot --silent; do
            sleep 1
          done

      - name: Run migrations
        run: php database/migrate.php

      - name: Check migrations success
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "USE inventory_test; SHOW TABLES;"

      - name: Check PHP syntax errors
        run: find src -name "*.php" -exec php -l {} \;

      - name: Run health check
        run: |
          php -S localhost:8000 -t public &
          sleep 2
          curl -f http://localhost:8000/health || exit 1

  # =====================================================
  # Security Scanning
  # =====================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install dependencies
        run: composer install --prefer-dist --no-dev

      - name: Security check for dependencies
        run: |
          composer audit || true

  # =====================================================
  # Continuous Deployment - Staging
  # =====================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.inventory.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.STAGING_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          ssh ${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }} << 'EOF'
            cd ${{ secrets.STAGING_PATH }}

            echo "📥 Pulling latest code..."
            git pull origin develop

            echo "📦 Installing dependencies..."
            composer install --no-dev --optimize-autoloader

            echo "🗄️ Running migrations..."
            php database/migrate.php

            echo "🔧 Setting permissions..."
            chmod -R 755 storage database

            echo "🔄 Restarting PHP-FPM..."
            sudo systemctl reload php-fpm || true

            echo "✅ Deployment completed!"
          EOF

      - name: Run health check on staging
        run: |
          sleep 3
          curl -f https://staging.inventory.example.com/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Staging deployment successful!"
          echo "URL: https://staging.inventory.example.com"

  # =====================================================
  # Continuous Deployment - Production
  # =====================================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://inventory.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        run: |
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd ${{ secrets.PRODUCTION_PATH }}

            echo "🔒 Creating backup..."
            ./backup.sh

            echo "📥 Pulling latest code..."
            git pull origin main

            echo "🚀 Running deployment script..."
            ./deploy.sh production

            echo "✅ Production deployment completed!"
          EOF

      - name: Run health check on production
        run: |
          sleep 5
          curl -f https://inventory.example.com/health || exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "✅ Production deployment successful!"
          echo "URL: https://inventory.example.com"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Manual intervention required."
          ssh ${{ secrets.PRODUCTION_USER }}@${{ secrets.PRODUCTION_HOST }} << 'EOF'
            cd ${{ secrets.PRODUCTION_PATH }}
            git reset --hard HEAD~1
            ./deploy.sh production
          EOF
